{{- if not .Values.existingSecret }}
# 只在没有指定 existingSecret 时渲染。
# 设了 existingSecret，这个文件不生成，此时**密钥必须已在集群里存在**，
# 否则 Pod 起来会因为缺少 CODEUP_TOKEN 而退出。
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "car.fullname" . }}
  labels:
    {{- include "car.labels" . | nindent 4 }}
type: Opaque
stringData:
  CODEUP_TOKEN: {{ required "必须提供 codeup.token（或用 existingSecret 引用已有 Secret）" .Values.codeup.token | quote }}
  LLM_API_KEY: {{ required "必须提供 llm.apiKey" .Values.llm.apiKey | quote }}
  WEBHOOK_TOKEN: {{ .Values.webhookToken | default (randAlphaNum 24) | quote }}
{{- end }}
